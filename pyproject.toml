[project]
name = "swing-quant"
version = "0.1.0"
description = "Swing trade quantitativo para B3 e EUA: dados, backtest, screener e alertas"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "polars>=1.0",
    "pandas>=2.2",
    "numpy>=1.26",
    "duckdb>=1.0",
    "pyarrow>=16.0",
    "yfinance>=0.2.40",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27",
    "pandas-market-calendars>=4.4",
    "lxml>=5.0",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.35", "plotly>=5.22"]

[dependency-groups]
research = [          # notebooks/ — o estudo swing vs investimentos
    "matplotlib>=3.8",
    "nbformat>=5.10",
    "nbconvert>=7.16",
    "ipykernel>=6.29",
]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
    "pandas-stubs",
]

[project.scripts]
swing-quant = "swing_quant.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/swing_quant"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "N",        # pep8-naming
    "SIM",      # simplify
    "RUF",      # ruff-specific
    "PD",       # pandas-vet
    "NPY",      # numpy
]
ignore = [
    "PD010",    # pivot_table vs unstack
    "RUF001", "RUF002", "RUF003",  # texto em pt-BR usa –, ×, − legitimamente
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"src/swing_quant/backtest/report.py" = ["E501"]  # strings de renderização
"src/swing_quant/backtest/portfolio.py" = ["E501"]
"src/swing_quant/alerts/telegram.py" = ["E501"]  # strings da mensagem
"src/swing_quant/monitoring/monthly.py" = ["E501"]
"src/swing_quant/cli.py" = ["E501"]  # tabelas/mensagens de terminal
"dashboard/**" = ["E501"]
"notebooks/**" = ["ALL"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
# Sem `python_version` fixo: o alvo acompanha o interpretador. Com 3.11 fixo, rodar sob 3.12
# quebra ao analisar os stubs do numpy, que usam `type X = ...` (PEP 695, só 3.12+). A matriz
# do CI roda mypy em 3.11 e 3.12, então as duas versões continuam cobertas; quem impede
# sintaxe nova no nosso código é o `target-version = "py311"` do ruff.
strict = true
warn_unreachable = true
files = ["src/swing_quant"]

[[tool.mypy.overrides]]
module = ["yfinance.*", "vectorbt.*", "pandas_market_calendars.*", "duckdb.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: testes que baixam dados ou rodam backtests longos",
    "network: exigem acesso à internet",
]

[tool.coverage.run]
source = ["swing_quant"]
branch = true
