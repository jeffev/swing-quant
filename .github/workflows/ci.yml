name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Configurar Python
        run: uv python install ${{ matrix.python-version }}

      - name: Instalar dependências
        run: uv sync --group dev

      - name: Lint (ruff)
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Tipos (mypy)
        run: uv run mypy

      - name: Testes
        run: uv run pytest --cov --cov-report=term-missing -m "not network and not slow"
